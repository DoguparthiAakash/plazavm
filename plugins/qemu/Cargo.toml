[package]
name = "qemu-plugin"
version.workspace = true
edition.workspace = true
description = "QEMU execution backend plugin for PlazaVM"

[dependencies]
plaza-foundation.workspace = true
plaza-plugin.workspace = true
plaza-runtime.workspace = true
async-trait.workspace = true
serde.workspace = true
