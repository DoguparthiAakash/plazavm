[package]
name = "plaza-runtime"
version.workspace = true
edition.workspace = true
description = "Runtime backend abstraction traits for PlazaVM — zero implementation"

[dependencies]
plaza-foundation.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
plaza-image = { version = "0.1.0", path = "../plaza-image" }
plaza-machine = { version = "0.1.0-dp1", path = "../plaza-machine" }
tokio = { workspace = true, features = ["sync", "process", "io-util", "rt", "time"] }
tokio-util = { workspace = true, features = ["codec"] }
bollard.workspace = true
wasmtime = "47.0.3"
uuid.workspace = true
semver.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber.workspace = true
