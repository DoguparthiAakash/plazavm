[workspace]
members = [
    # ── Legacy / Uncategorized ──
    
    
    

    # ── Shared ──
    "shared/plaza-foundation",
    "shared/plaza-command",
    "shared/plaza-sdk",

    # ── Engines ──
    "engines/plaza-workspace",
    "engines/plaza-runtime",
    "engines/plaza-storage",
    "engines/plaza-registry",
    "engines/plaza-plugin",
    "engines/plaza-image",
    "engines/plaza-package",
    "engines/plaza-snapshot",

    # ── Platform ──
    "platform/plaza-security",
    "platform/plaza-network",
    "platform/plaza-resource",
    "platform/plaza-ai",
    "platform/plaza-api",
    "platform/plaza-cloud",

    # ── Apps ──
    "apps/plaza-cli",
    "apps/plaza-desktop/src-tauri",

    # ── OS ──
    "os/plaza-os",
    "os/plaza-init",
    "os/plaza-agent",
    "os/plaza-kernel",
    "os/plaza-installer",

    # ── Specs & Docs ──
    "specifications/plaza-specifications",
    "docs/plaza-docs",
    "examples/plaza-examples",
    "tools/plaza-build",
    "integration/plaza-manifest",
    "tools/publication-manager",

    # ── Runtime Plugins ──
    "plugins/docker",
    "plugins/virtualbox",
    "plugins/qemu",
    "plugins/podman",
    "plugins/hyperv",
]
resolver = "2"

[workspace.package]
version = "0.1.0-dp1"
edition = "2021"
authors = ["PlazaVM Contributors"]
license = "MIT"
repository = "https://github.com/plazavm/plazavm"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "net", "signal"] }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
bollard = "0.18"

# Error handling
thiserror = "2"
anyhow = "1"

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# System info and directories
sysinfo = "0.33"
lazy_static = "1.4"
dirs = "6"
zip = "2"

# Semver
semver = { version = "1", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Tauri
tauri = { version = "2", features = [] }
tauri-build = "2"

# Cross-crate references
plaza-core = { path = "plaza-core" }
plaza-events = { path = "plaza-events" }
plaza-config = { path = "plaza-config" }
plaza-storage = { path = "engines/plaza-storage" }
plaza-monitor = { path = "plaza-monitor" }
plaza-registry = { path = "engines/plaza-registry" }
plaza-platform = { path = "plaza-platform" }
plaza-workspace = { path = "engines/plaza-workspace" }
plaza-controller = { path = "plaza-controller" }
plaza-decision = { path = "plaza-decision" }
plaza-resource = { path = "platform/plaza-resource" }
plaza-ai = { path = "platform/plaza-ai" }
plaza-runtime = { path = "engines/plaza-runtime" }
plaza-plugin = { path = "engines/plaza-plugin" }
plaza-api = { path = "platform/plaza-api" }
plaza-foundation = { path = "shared/plaza-foundation" }
plaza-command = { path = "shared/plaza-command" }


