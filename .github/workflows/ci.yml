name: PlazaVM v2 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Build, Lint & Test (Rust & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config build-essential libssl-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Code Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Workspace Lint Audit
        run: cargo clippy --workspace -- -D warnings

      - name: Run Workspace Test Suite
        run: cargo test --workspace

      - name: Build Cargo Workspace
        run: cargo build --workspace --release

      - name: Generate Rust Documentation
        run: cargo doc --workspace --no-deps

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./plaza-desktop
        run: npm ci

      - name: Typecheck Desktop Frontend
        working-directory: ./plaza-desktop
        run: npx tsc --noEmit
